# ATLAS default hyperparameters (implementation plan §7.7)
# All values are fixed; only the sensitivity run sweeps τ and q.
#
# NOTHING LOADS THIS FILE (FIX_SPEC.md C9) -- no script in this repo reads
# configs/atlas/*.yaml; every script (run_e0.py, run_e1.py, run_e2.py,
# run_e4.py) hardcodes its own argparse defaults, which is the actual live
# source of truth. This file (and e0.yaml/e1.yaml/e2.yaml/e4.yaml) is
# documentation only, kept in sync by hand -- verified against the real
# script defaults 2026-08-27/28 (see e4.yaml's header for the two places
# that had drifted). Same convention as configs/regimes/pusht.yaml:3-5.

atlas:
  tau: 0.5          # UMF adequacy threshold
  q: 3              # consecutive informative strikes before arming the probe
  hysteresis: 0.05  # margin m: keep current chart unless beaten by > m
  n_probe: 20       # gradient steps to fit the expansion candidate
  k_max: 10         # hard library cap
  lr: 5e-4          # AdaJEPA learning rate (chart refinement and probe fitting)
  router: umf       # default router; overridden per-experiment

adajepa:
  lr: 5e-4
  buffer_size: 5    # most recent transitions
  refine_steps: 1   # gradient steps per replan

planner:
  # Corrected 2026-08-25 (E3_E4_IMPLEMENTATION_PLAN.md Phase 8): the values
  # below (200/10/25/5) were AdaJEPA's own budget (a DIFFERENT substrate --
  # see ATLAS_implementation_plan_v2.md §7.0a), not this project's. Corrected
  # to dino_wm_pusht's own validated Push-T config (the one it reports ~90%
  # SR under), plus E4's num_act_stepped=1 deviation (nas=6 gives ONE replan
  # per 30-raw-step episode, which cannot exercise routing/refinement/
  # Expander verification -- see scripts/run_e4.py's own CEM_NUM_ACT_STEPPED
  # comment for the full reasoning).
  cem_samples: 300
  cem_opt_steps: 30
  horizon: 6
  executed_actions: 1     # num_act_stepped, E4 deviation (see comment above)
  max_mpc_steps: 30

# Informative-chunk gate computed from training data (10th percentile of displacement)
# Set to null to disable the gate; it will be computed and cached on first run.
motion_gate: null
