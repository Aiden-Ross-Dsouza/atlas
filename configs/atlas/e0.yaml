# E0 — Adapter capacity experiment config
#
# NOTHING LOADS THIS FILE (FIX_SPEC.md C9, see configs/atlas/default.yaml's
# header). Verified against scripts/run_e0.py's real argparse defaults
# 2026-08-28: n_steps=2000/lr=5e-4 match --steps/--lr exactly. No
# disagreement found in this file.
defaults:
  - default

e0:
  kinds: [ln_act, lora4, full]
  regimes: [R1, R2]
  n_steps: 2000
  lr: 5e-4
  # Pre-registered pass criterion (implementation plan §7.1):
  # smallest kind reaching ≥ 90% of full-predictor gain in BOTH UMF reduction
  # AND success, in BOTH regimes.
  pass_threshold: 0.90
  out_subdir: e0
