[project]
name = "atlas-wm"
version = "0.1.0"
description = "ATLAS: Routing persistent adapters for continual JEPA world models"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    # ── Core scientific stack ──────────────────────────────────────────────────
    "torch>=2.3.0",
    "torchvision>=0.18.0",
    "numpy>=1.26",
    "scipy>=1.13",
    "pandas>=2.2",
    "statsmodels>=0.14",

    # ── Config / IO ───────────────────────────────────────────────────────────
    "omegaconf>=2.3",
    "pyyaml>=6.0",
    "tqdm>=4.66",

    # ── Visualisation ─────────────────────────────────────────────────────────
    "matplotlib>=3.9",

    # ── Push-T environment ────────────────────────────────────────────────────
    "gymnasium>=0.29",
    "pymunk>=6.8",
    "imageio>=2.34",
    "opencv-python-headless>=4.9",

    # jepa-wms is intentionally NOT listed here -- uv/pip can't reliably
    # resolve a relative `file:` path for a dependency of this project's own
    # wheel, and a hardcoded absolute path isn't portable (breaks on any other
    # machine or in a container). Install it separately:
    #   pip install -e vendor/jepa-wms
    # vendor/jepa-wms is a local clone of github.com/facebookresearch/jepa-wms
    # with one patch — its [tool.uv.sources] pin for metaworld/d4rl to a git
    # "master" branch that no longer exists upstream is removed (see
    # code-review.md). No jepa-wms model/eval code was touched.
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]
modal = [
    "modal>=0.64",
]

[project.scripts]
atlas-download  = "scripts.download_data:main"
atlas-gates     = "scripts.smoke_gates:main"
atlas-e0        = "scripts.run_e0:main"
atlas-e1        = "scripts.run_e1:main"
atlas-e2        = "scripts.run_e2:main"
atlas-e4        = "scripts.run_e4:main"
atlas-e5        = "scripts.run_e5:main"
atlas-tables    = "scripts.make_tables:main"
atlas-figures   = "scripts.make_figures:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["atlas", "scripts"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
